spring:
  application:
    name: taskflow-backend-test

  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_test
    username: taskflow
    password: taskflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: test-secret-key-for-jwt-token-signing-must-be-long-enough-256-bits
    expiration: 86400000

logging:
  level:
    com.taskflow: DEBUG
